<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Adhan Clock Admin{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <h1>Adhan Clock</h1>
    <nav>
      <a href="{{ url_for('status_view') }}" class="{{ 'active' if request.endpoint == 'status_view' }}">Status</a>
      <a href="{{ url_for('settings_view') }}" class="{{ 'active' if request.endpoint == 'settings_view' }}">Settings</a>
      <a href="{{ url_for('audio_view') }}" class="{{ 'active' if request.endpoint and request.endpoint.startswith('audio_') }}">Audio</a>
      <a href="{{ url_for('mawaqit_view') }}" class="{{ 'active' if request.endpoint and request.endpoint.startswith('mawaqit_') }}">Mawaqit</a>
    </nav>
  </header>
  <main class="content">
    {% block content %}{% endblock %}
  </main>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
